#
# Shield defaults. Zephyr merges this file after the board defconfig and before
# the user's config/prospector.conf, so a consumer can override any line. The
# display and USB values are the ones canon ran on hardware with
# prospector-zmk-module v2.2.3 (config/prospector_scanner.conf, 2026-09-26).

# ---- Display / LVGL ----
CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
# ZMK takes the screen from zmk_display_status_screen(), src/prospector_screen.c.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# The LVGL pool size is a Kconfig.defconfig default (48 KiB, more with a
# sprite): a line here would fix it for both kinds of build.
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_VDB_SIZE=30
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
# A guard, not a current need: no thread runs FP code today (llvm-objdump of
# zmk.elf, 2026-09-26: only libc's %f/%e paths hold VFP instructions). With it,
# a later FP user cannot corrupt another thread's FP state on a context switch.
CONFIG_FPU_SHARING=y
CONFIG_GPIO=y
# ZMK implies LV_CONF_MINIMAL, so every widget and font is opt-in: here the HP
# bar's (src/hp_bar.c; the sprite's come from BEACON_SPRITE). The default font
# is linked even when no label uses it, so it is the one the screen uses.
# unscii 8 (LVGL's minimal default) and ZMK's small font (Montserrat 12, for a
# mono theme this screen does not install) would be compiled and never
# linked; they are off so that .config lists only the font in the image.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_FONT_DEFAULT_UNSCII_16=y
CONFIG_LV_FONT_UNSCII_8=n
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_UNSCII_16=y

# ---- Bluetooth: observer only ----
# src/status_observer.c brings Bluetooth up and scans; nothing advertises.
# ZMK_BLE=n removes ZMK's ble.c (its bt_enable() and the connectable HID
# advertisement a Mac could pair with, seen as "Prospect" on 2026-09-26) along
# with SMP, bonding and settings. BT and BT_OBSERVER are then set by hand;
# BROADCASTER, PERIPHERAL and CENTRAL default off.
CONFIG_ZMK_BLE=n
CONFIG_BT=y
CONFIG_BT_OBSERVER=y

# ---- Backlight (pwm-leds) ----
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# ---- USB: one CDC ACM port, no HID ----
# A display, not an input device. ZMK_USB=n keeps the HID class off (the board
# defconfig turns it on); the USB stack stays for the CDC ACM port that the
# 1200 baud bootloader entry listens on. BOARD_SERIAL_BACKEND_CDC_ACM=n keeps
# the xiao_ble board's console set (SERIAL / CONSOLE / UART_CONSOLE) off, so
# nothing logs to the port unless CONFIG_ZMK_USB_LOGGING=y asks for it;
# USB_CDC_ACM depends on SERIAL, hence the explicit line.
# USB_DEVICE_PRODUCT is a contract with canon's scripts/flash-prospector.sh,
# which finds the device by this exact string (VID/PID are ZMK's defaults and
# the Imprint Dongle shares them). Change both together.
CONFIG_ZMK_USB=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="Prospector Dongle"

# ---- Off ----
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_STUDIO=n
CONFIG_PM_DEVICE=n
