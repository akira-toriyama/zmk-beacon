# This repository's own build of the prospector shield (scripts/build.sh and
# CI): the screen canon runs, so that CI compiles hp_bar.c and a local
# --sprite --sprite-name build shows the name. The shield's Kconfig default
# stays the digits; a consumer picks its own in its config/prospector.conf.
CONFIG_BEACON_SPRITE_FILL=y
CONFIG_BEACON_READINGS_HP_BAR=y
