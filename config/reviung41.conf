# The broadcaster's check build on a keyboard that is not a split (build.yaml):
# README's recipe on ZMK's Reviung41, two lines. A split central's third line,
# the battery fetching, exists only on a split central and would drop out here
# with a warning. The keyboard's own battery takes the left byte by default
# (BEACON_OWN_BATTERY).

CONFIG_BEACON_STATUS_BROADCAST=y

# The broadcaster selects BT_EXT_ADV, under which the host serves ZMK's own
# advertising from the same pool of sets: 2, or src/status_broadcaster.c's
# BUILD_ASSERT stops the build.
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
