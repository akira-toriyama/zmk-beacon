# The broadcaster's check build (build.yaml): README's recipe for a keyboard's
# split central, on ZMK's Corne, whose left half is the central by the shield's
# default. corne_right, a peripheral, would drop these lines with a warning.

CONFIG_BEACON_STATUS_BROADCAST=y

# The broadcaster selects BT_EXT_ADV, under which the host serves ZMK's own
# advertising from the same pool of sets: 2, or src/status_broadcaster.c's
# BUILD_ASSERT stops the build.
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

# The payload's battery bytes come from ZMK's peripheral battery events, which
# a central raises only with this line; without it the build passes and the
# Prospector Dongle shows --/100.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
