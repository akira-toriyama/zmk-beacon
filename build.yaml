# Build matrix: the single source of board/shield pairs for CI
# (.github/workflows/zmk-build.yml), the release (release.yml) and the local
# build (scripts/build.sh). Entries follow ZMK's build.yaml include: form.
---
include:
  - board: xiao_ble/nrf52840/zmk
    shield: prospector
  # The check that the broadcaster builds on a stock split central, unpatched:
  # ZMK's Corne on the nice!nano, its left half the central, with README's
  # recipe (config/corne_left.conf). release.yml builds it and never attaches it.
  - board: nice_nano/nrf52840/zmk
    shield: corne_left
