name: ShellCheck

# Static check of the shell scripts (scripts/build.sh). shellcheck ships with
# the GitHub Ubuntu runner, so there is nothing to install.
on:
  # push only on main: a PR branch is checked once, through pull_request.
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - "**/*.bash"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**/*.sh"
      - "**/*.bash"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Lint-only, never pushes.
          persist-credentials: false
      - name: Run shellcheck
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh' '*.bash')
          echo "files:"; echo "$files"
          # Word-splitting the newline-separated list is intended (no spaces
          # in tracked file names).
          # shellcheck disable=SC2086
          shellcheck $files
